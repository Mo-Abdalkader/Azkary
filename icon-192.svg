  <!-- Minaret right -->
  <rect x="132" y="60" width="10" height="40" rx="5" fill="url(#g1)" opacity="0.7"/>
  <ellipse cx="137" cy="60" rx="6" ry="10" fill="url(#g1)" opacity="0.8"/>
  <!-- Body -->
